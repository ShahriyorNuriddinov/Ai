<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply D2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon"
        href="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/64903c236b31c507431e589c_32x32.png">
    <link rel="stylesheet" href="https://embed.typeform.com/next/css/widget.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #1a1a2e;
            -webkit-font-smoothing: antialiased;
        }

        .page-wrapper {
            overflow: hidden;
        }

        .apply-section {
            padding: 40px 20px 60px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            height: 35px;
            margin-bottom: 20px;
        }

        .heading-h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 20px;
            max-width: 700px;
        }

        .blue-highlight {
            color: #2563eb;
        }

        .tp-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .img-cl {
            width: 140px;
            height: auto;
        }

        .member-text {
            font-size: 14px;
            color: #333;
            text-align: left;
        }

        .tp-bold {
            font-weight: 700;
        }

        .tp-logo {
            height: 20px;
            margin-left: 5px;
        }

        .typeform-embed-container {
            width: 100%;
            max-width: 940px;
            height: 600px;
            margin: 30px auto 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #f8f8f8;
        }

        .typeform-embed-container .tf-v1-widget iframe {
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .heading-h1 {
                font-size: 24px;
            }

            .typeform-embed-container {
                height: 500px;
            }

            .img-cl {
                width: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <section class="apply-section">
            <!-- Logo -->
            <img src="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/67f6268101eba104994c5127_6534e941d827f094326dc841_logo%20white%201.png"
                alt="Decentralized Masters" class="main-logo" style="filter: brightness(0);">

            <h1 class="heading-h1">Apply now to join <span class="blue-highlight">Decentralized Masters</span></h1>

            <!-- Trust Indicators -->
            <div class="tp-wrapper">
                <img src="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/66f287e4489430b5d4d3de76_Member-Images.webp"
                    alt="Members" class="img-cl">
                <div class="member-text">
                    <span class="tp-bold">3000+ DeFi Members</span><br>
                    Successfully Served
                </div>
            </div>
            <div class="tp-wrapper" style="margin-bottom: 20px;">
                <span style="font-size: 14px; color: #333;"><span class="tp-bold">Excellent 4.9</span> out of 5</span>
                <img src="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/6842dbd7d5eddf1443cbb06e_Trustpilot%20Logo.png"
                    alt="Trustpilot" class="tp-logo">
            </div>

            <!-- TypeForm Embed -->
            <div class="typeform-embed-container">
                <div id="typeform-wrapper" style="width:100%;height:100%;"></div>
            </div>
        </section>
    </div>

    <script src="https://embed.typeform.com/next/embed.js"></script>
    <script>
        window.tf.createWidget('nbLowr3v', {
            container: document.getElementById('typeform-wrapper'),
            opacity: 100,
            hideHeaders: false,
            hideFooter: false,
            onSubmit: function () {
                window.location.href = 'booking.html';
            }
        });
    </script>
</body>

</html>
