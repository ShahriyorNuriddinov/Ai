<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Meeting - Decentralized Masters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon"
        href="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/64903c236b31c507431e589c_32x32.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Phone with country selector */
        .phone-input-wrapper {
            display: flex;
            align-items: stretch;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: visible;
            transition: border-color 0.15s;
            position: relative;
            background: #fff;
            min-height: 48px;
        }

        .phone-input-wrapper:focus-within {
            border-color: #2563eb;
            box-shadow: none;
        }

        .country-dropdown-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 10px;
            font-size: 14px;
            font-weight: 500;
            background: #f8f9fb;
            border: none;
            border-right: 1px solid #e0e0e0;
            cursor: pointer;
            color: #1a2332;
            min-width: 100px;
            font-family: inherit;
            user-select: none;
            white-space: nowrap;
            border-radius: 8px 0 0 8px;
        }

        .country-dropdown-trigger .flag-img {
            width: 24px;
            height: 18px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
        }

        .country-dropdown-trigger .arrow {
            font-size: 10px;
            color: #6b7d93;
            margin-left: 2px;
        }

        .country-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            max-height: 400px !important;
            height: auto;
            z-index: 1000;
            min-width: 280px;
            margin-top: 4px;
        }

        .country-dropdown.open {
            display: block;
        }

        .country-dropdown-search {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 10;
        }

        .country-dropdown-search input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        .country-dropdown-search input:focus {
            border-color: #2563eb;
        }

        #countryList {
            max-height: none !important;
            height: 340px !important;
            overflow-y: scroll !important;
            overflow-x: hidden !important;
        }

        .country-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 14px;
            color: #1a2332;
            transition: background 0.1s;
            min-height: 44px;
        }

        .country-option:hover {
            background: #f0f8fb;
        }

        .country-option .flag-img {
            width: 24px;
            height: 18px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
        }

        .country-option .country-name {
            color: #6b7d93;
            font-size: 13px;
        }

        .phone-input-wrapper input[type="tel"] {
            border: none !important;
            padding: 14px 16px !important;
            font-size: 14px !important;
            flex: 1;
            min-width: 0;
            outline: none;
            font-family: inherit;
            margin-bottom: 0 !important;
        }

        .phone-input-wrapper input[type="tel"]:focus {
            outline: none;
            box-shadow: none;
            border-color: transparent !important;
        }

        .phone-input-wrapper input[type="tel"]::placeholder {
            color: #999;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .country-dropdown {
                min-width: 100%;
                left: 0;
                right: 0;
            }

            .country-dropdown-trigger {
                min-width: 90px;
                padding: 12px 8px;
                font-size: 13px;
            }

            .phone-input-wrapper {
                min-height: 44px;
            }
        }

        @media (max-width: 480px) {
            .country-dropdown-trigger {
                min-width: 80px;
                padding: 10px 6px;
                font-size: 12px;
            }

            .country-dropdown-trigger .flag-img {
                width: 20px;
                height: 15px;
            }

            .phone-input-wrapper input[type="tel"] {
                padding: 12px 14px !important;
                font-size: 13px !important;
            }
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <section class="booking-section">
            <div class="container">
                <!-- Logo -->
                <div style="margin-bottom: 15px;">
                    <img src="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/67f6268101eba104994c5127_6534e941d827f094326dc841_logo%20white%201.png"
                        alt="Decentralized Masters" style="height: 35px; filter: brightness(0);">
                </div>

                <h1 class="booking-heading">Book a meeting with a <span class="blue-highlight">Decentralized
                        Masters</span> member</h1>

                <!-- Trust Indicators -->
                <div class="trust-wrapper" style="margin-bottom: 30px;">
                    <div class="tp-wrapper members">
                        <img src="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/66f287e4489430b5d4d3de76_Member-Images.webp"
                            alt="Members" class="member-images">
                        <div class="member-text">
                            <span class="tp-bold">3000+ DeFi Members</span><br>
                            Successfully Served
                        </div>
                    </div>
                    <div class="tp-wrapper trustpilot">
                        <span class="tp-bold">Excellent 4.9</span> out of 5
                        <img src="https://cdn.prod.website-files.com/64903c236b31c507431e57fa/6842dbd7d5eddf1443cbb06e_Trustpilot%20Logo.png"
                            alt="Trustpilot" class="tp-logo">
                    </div>
                </div>

                <!-- Booking Container -->
                <div class="booking-container" id="bookingContainer">
                    <!-- Calendar Side -->
                    <div class="booking-calendar">
                        <div class="booking-calendar-logo">DM</div>
                        <div class="booking-calendar-title">Meet with Decentralized Masters</div>

                        <div class="calendar-nav">
                            <button class="calendar-nav-btn" onclick="changeMonth(-1)">‹</button>
                            <span class="calendar-month" id="calendarMonth"></span>
                            <button class="calendar-nav-btn" onclick="changeMonth(1)">›</button>
                        </div>

                        <div class="calendar-grid" id="calendarGrid"></div>
                    </div>

                    <!-- Time Slots Side -->
                    <div class="booking-times">
                        <div class="booking-times-header">Meeting location</div>
                        <div class="booking-times-location">📍 Interview Call</div>

                        <div class="booking-times-header">Meeting duration</div>
                        <div class="booking-times-duration">15 mins</div>

                        <div class="booking-date-label">What time works best?</div>
                        <div class="booking-date-showing" id="dateShowing">Showing times for <strong
                                id="selectedDateText"></strong></div>

                        <select class="timezone-select" id="timezoneSelect">
                            <optgroup label="🇺🇿 Central Asia">
                                <option value="UTC+05:00">UTC +05:00 Uzbekistan Time</option>
                                <option value="UTC+07:00">UTC +07:00 Indochina Time</option>
                                <option value="UTC+03:00">UTC +03:00 Moscow Time</option>
                            </optgroup>
                            <optgroup label="🇺🇸 USA">
                                <option value="UTC-05:00">UTC -05:00 Eastern Time (ET)</option>
                                <option value="UTC-06:00">UTC -06:00 Central Time (CT)</option>
                                <option value="UTC-07:00">UTC -07:00 Mountain Time (MT)</option>
                                <option value="UTC-08:00">UTC -08:00 Pacific Time (PT)</option>
                                <option value="UTC-09:00">UTC -09:00 Alaska Time (AKT)</option>
                                <option value="UTC-10:00">UTC -10:00 Hawaii Time (HST)</option>
                            </optgroup>
                            <optgroup label="🇨🇦 Canada">
                                <option value="UTC-03:30">UTC -03:30 Newfoundland Time (NT)</option>
                                <option value="UTC-04:00">UTC -04:00 Atlantic Time (AT)</option>
                                <option value="UTC-05:00">UTC -05:00 Eastern Time — Toronto</option>
                                <option value="UTC-06:00">UTC -06:00 Central Time — Winnipeg</option>
                                <option value="UTC-07:00">UTC -07:00 Mountain Time — Calgary</option>
                                <option value="UTC-08:00">UTC -08:00 Pacific Time — Vancouver</option>
                            </optgroup>
                            <optgroup label="🇪🇺 Europe">
                                <option value="UTC+00:00">UTC +00:00 GMT — London</option>
                                <option value="UTC+01:00">UTC +01:00 CET — Paris, Berlin, Rome</option>
                                <option value="UTC+02:00">UTC +02:00 EET — Helsinki, Kyiv</option>
                                <option value="UTC+03:00">UTC +03:00 MSK — Moscow, Istanbul</option>
                            </optgroup>
                            <optgroup label="🇦🇺 Australia">
                                <option value="UTC+08:00">UTC +08:00 AWST — Perth</option>
                                <option value="UTC+09:30">UTC +09:30 ACST — Darwin, Adelaide</option>
                                <option value="UTC+10:00">UTC +10:00 AEST — Sydney, Melbourne</option>
                                <option value="UTC+10:30">UTC +10:30 ACDT — Adelaide (Summer)</option>
                                <option value="UTC+11:00">UTC +11:00 AEDT — Sydney (Summer)</option>
                            </optgroup>
                        </select>

                        <div class="time-slots" id="timeSlots"></div>

                        <!-- Booking Form (shows after time selection) -->
                        <div class="booking-form" id="bookingForm">
                            <input type="text" class="booking-form-input" id="bookingName"
                                placeholder="Your full name *" required>
                            <input type="email" class="booking-form-input" id="bookingEmail" placeholder="Your email *"
                                required>
                            <div style="margin-bottom: 12px;">
                                <div class="phone-input-wrapper">
                                    <input type="hidden" name="countryCode" id="countryCodeHidden" value="+998">
                                    <div class="country-dropdown-trigger" id="countryTrigger">
                                        <img class="flag-img" id="selectedFlag" src="https://flagcdn.com/w40/uz.png"
                                            alt="UZ">
                                        <span id="selectedCode">+998</span>
                                        <span class="arrow">&#9660;</span>
                                    </div>
                                    <div class="country-dropdown" id="countryDropdown"
                                        style="max-height: 400px !important;">
                                        <div class="country-dropdown-search">
                                            <input type="text" id="countrySearch" placeholder="Search country...">
                                        </div>
                                        <div id="countryList" style="max-height: 340px !important; overflow-y: auto;">
                                        </div>
                                    </div>
                                    <input type="tel" id="bookingPhone" placeholder="Your WhatsApp number *" required>
                                </div>
                            </div>
                            <button class="booking-submit-btn" onclick="submitBooking()">Confirm Booking</button>
                        </div>
                    </div>
                </div>

                <p style="margin-top: 20px; font-size: 14px; color: #666;">
                    Need more availability? <a href="#" style="color: #2563eb; text-decoration: underline;">Click
                        Here</a>
                </p>
            </div>
        </section>
    </div>

    <script src="js/tg-config.js"></script>
    <script>
        // Country codes data with ISO codes for flag images
        var countries = [
            { code: '+1', iso: 'us', name: 'United States' },
            { code: '+1', iso: 'ca', name: 'Canada' },
            { code: '+44', iso: 'gb', name: 'United Kingdom' },
            { code: '+49', iso: 'de', name: 'Germany' },
            { code: '+33', iso: 'fr', name: 'France' },
            { code: '+39', iso: 'it', name: 'Italy' },
            { code: '+34', iso: 'es', name: 'Spain' },
            { code: '+351', iso: 'pt', name: 'Portugal' },
            { code: '+31', iso: 'nl', name: 'Netherlands' },
            { code: '+32', iso: 'be', name: 'Belgium' },
            { code: '+41', iso: 'ch', name: 'Switzerland' },
            { code: '+43', iso: 'at', name: 'Austria' },
            { code: '+46', iso: 'se', name: 'Sweden' },
            { code: '+47', iso: 'no', name: 'Norway' },
            { code: '+45', iso: 'dk', name: 'Denmark' },
            { code: '+358', iso: 'fi', name: 'Finland' },
            { code: '+48', iso: 'pl', name: 'Poland' },
            { code: '+420', iso: 'cz', name: 'Czech Republic' },
            { code: '+36', iso: 'hu', name: 'Hungary' },
            { code: '+40', iso: 'ro', name: 'Romania' },
            { code: '+380', iso: 'ua', name: 'Ukraine' },
            { code: '+7', iso: 'ru', name: 'Russia' },
            { code: '+81', iso: 'jp', name: 'Japan' },
            { code: '+82', iso: 'kr', name: 'South Korea' },
            { code: '+86', iso: 'cn', name: 'China' },
            { code: '+91', iso: 'in', name: 'India' },
            { code: '+62', iso: 'id', name: 'Indonesia' },
            { code: '+60', iso: 'my', name: 'Malaysia' },
            { code: '+65', iso: 'sg', name: 'Singapore' },
            { code: '+998', iso: 'uz', name: 'Uzbekistan' },
            { code: '+66', iso: 'th', name: 'Thailand' },
            { code: '+84', iso: 'vn', name: 'Vietnam' },
            { code: '+63', iso: 'ph', name: 'Philippines' },
            { code: '+61', iso: 'au', name: 'Australia' },
            { code: '+64', iso: 'nz', name: 'New Zealand' },
            { code: '+55', iso: 'br', name: 'Brazil' },
            { code: '+52', iso: 'mx', name: 'Mexico' },
            { code: '+54', iso: 'ar', name: 'Argentina' },
            { code: '+57', iso: 'co', name: 'Colombia' },
            { code: '+56', iso: 'cl', name: 'Chile' },
            { code: '+51', iso: 'pe', name: 'Peru' },
            { code: '+90', iso: 'tr', name: 'Turkey' },
            { code: '+972', iso: 'il', name: 'Israel' },
            { code: '+971', iso: 'ae', name: 'UAE' },
            { code: '+966', iso: 'sa', name: 'Saudi Arabia' },
            { code: '+20', iso: 'eg', name: 'Egypt' },
            { code: '+27', iso: 'za', name: 'South Africa' },
            { code: '+234', iso: 'ng', name: 'Nigeria' },
            { code: '+254', iso: 'ke', name: 'Kenya' },
            { code: '+992', iso: 'tj', name: 'Tajikistan' },
            { code: '+996', iso: 'kg', name: 'Kyrgyzstan' },
            { code: '+993', iso: 'tm', name: 'Turkmenistan' },
            { code: '+994', iso: 'az', name: 'Azerbaijan' },
            { code: '+374', iso: 'am', name: 'Armenia' },
            { code: '+995', iso: 'ge', name: 'Georgia' },
            { code: '+375', iso: 'by', name: 'Belarus' },
            { code: '+373', iso: 'md', name: 'Moldova' },
            { code: '+370', iso: 'lt', name: 'Lithuania' },
            { code: '+371', iso: 'lv', name: 'Latvia' },
            { code: '+372', iso: 'ee', name: 'Estonia' }
        ];

        function flagUrl(iso) {
            return 'https://flagcdn.com/w40/' + iso + '.png';
        }

        // Build custom country dropdown
        var trigger = document.getElementById('countryTrigger');
        var dropdown = document.getElementById('countryDropdown');
        var countryList = document.getElementById('countryList');
        var searchInput = document.getElementById('countrySearch');
        var selectedFlag = document.getElementById('selectedFlag');
        var selectedCode = document.getElementById('selectedCode');
        var hiddenInput = document.getElementById('countryCodeHidden');
        var selectedCountry = countries[0]; // Default Uzbekistan

        function renderCountryList(filter) {
            countryList.innerHTML = '';
            var q = (filter || '').toLowerCase();
            countries.forEach(function (c) {
                if (q && c.name.toLowerCase().indexOf(q) === -1 && c.code.indexOf(q) === -1 && c.iso.indexOf(q) === -1) return;
                var div = document.createElement('div');
                div.className = 'country-option';
                div.innerHTML = '<img class="flag-img" src="' + flagUrl(c.iso) + '" alt="' + c.iso + '"> <span>' + c.code + '</span> <span class="country-name">' + c.name + '</span>';
                div.addEventListener('click', function () {
                    selectCountry(c);
                    dropdown.classList.remove('open');
                });
                countryList.appendChild(div);
            });
        }

        function selectCountry(c) {
            selectedCountry = c;
            selectedFlag.src = flagUrl(c.iso);
            selectedFlag.alt = c.iso;
            selectedCode.textContent = c.code;
            hiddenInput.value = c.code;
        }

        trigger.addEventListener('click', function (e) {
            e.stopPropagation();
            dropdown.classList.toggle('open');
            if (dropdown.classList.contains('open')) {
                searchInput.value = '';
                renderCountryList('');
                setTimeout(function () { searchInput.focus(); }, 50);
            }
        });

        searchInput.addEventListener('input', function () {
            renderCountryList(this.value);
        });

        searchInput.addEventListener('click', function (e) { e.stopPropagation(); });

        document.addEventListener('click', function () {
            dropdown.classList.remove('open');
        });

        renderCountryList('');

        // Try to detect user's country via timezone
        var userTz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        var detected = null;
        if (userTz.includes('Tashkent') || userTz.includes('Samarkand')) {
            detected = countries.find(function (c) { return c.iso === 'uz'; });
        } else if (userTz.includes('London')) {
            detected = countries.find(function (c) { return c.iso === 'gb'; });
        } else if (userTz.includes('Berlin')) {
            detected = countries.find(function (c) { return c.iso === 'de'; });
        } else if (userTz.includes('Moscow')) {
            detected = countries.find(function (c) { return c.iso === 'ru'; });
        } else if (userTz.includes('Istanbul')) {
            detected = countries.find(function (c) { return c.iso === 'tr'; });
        } else if (userTz.includes('New_York') || userTz.includes('Los_Angeles') || userTz.includes('Chicago')) {
            detected = countries.find(function (c) { return c.iso === 'us'; });
        } else if (userTz.includes('Toronto') || userTz.includes('Vancouver')) {
            detected = countries.find(function (c) { return c.iso === 'ca'; });
        } else if (userTz.includes('Sydney') || userTz.includes('Melbourne')) {
            detected = countries.find(function (c) { return c.iso === 'au'; });
        }
        if (detected) selectCountry(detected);
    </script>
    <script src="js/booking.js"></script>
</body>

</html>
